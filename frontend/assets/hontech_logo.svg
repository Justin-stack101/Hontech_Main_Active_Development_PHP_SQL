<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <defs>
    <!-- Smooth drop shadow for high contrast rendering -->
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="hontech-official-logo">
    <!-- Top Sleek Car Silhouette -->
    <!-- Front bumper, hood, windshield, roofline, rear spoiler tail -->
    <path d="M 8 68 
             C 18 52, 35 44, 52 42
             L 130 42 
             C 180 34, 230 14, 275 14
             C 340 14, 420 22, 470 42
             C 495 52, 510 60, 515 68
             C 500 62, 475 52, 440 46
             C 385 36, 310 32, 260 32
             C 195 32, 140 44, 90 56
             C 55 64, 30 68, 8 68 Z" 
          fill="#5a5e65" />

    <!-- Front Fender / Hood Edge Shadow Accent -->
    <path d="M 8 68 L 28 48 L 42 66 Z" fill="#5a5e65" />

    <!-- Inner Window Canopy Line -->
    <path d="M 145 42
             C 185 35, 235 24, 275 24
             C 325 24, 385 30, 425 42
             C 375 36, 315 32, 270 32
             C 220 32, 175 38, 145 42 Z" 
          fill="#3c3f44" opacity="0.6"/>

    <!-- 'H' in Red -->
    <path d="M 40 70 L 64 70 L 64 85 L 82 85 L 82 70 L 106 70 L 106 118 L 82 118 L 82 101 L 64 101 L 64 118 L 40 118 Z" 
          fill="#FF0000" />

    <!-- 'O' as Precision Automotive Wheel Rim -->
    <g transform="translate(142, 94)">
      <!-- Outer Tire Ring -->
      <circle cx="0" cy="0" r="24" fill="#555a60" />
      <circle cx="0" cy="0" r="20" fill="#ffffff" />
      <circle cx="0" cy="0" r="18" fill="#555a60" />
      
      <!-- Hub & Spokes Pattern -->
      <circle cx="0" cy="0" r="6" fill="#2d3034" />
      <!-- 6 Rim Spokes -->
      <rect x="-2.5" y="-17" width="5" height="34" fill="#555a60" rx="1" />
      <rect x="-2.5" y="-17" width="5" height="34" fill="#555a60" rx="1" transform="rotate(60)" />
      <rect x="-2.5" y="-17" width="5" height="34" fill="#555a60" rx="1" transform="rotate(120)" />
      <!-- Center Lug Nut Hub -->
      <circle cx="0" cy="0" r="4.5" fill="#3c4045" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- 'N' in Red -->
    <path d="M 178 70 L 202 70 L 222 98 L 222 70 L 244 70 L 244 118 L 220 118 L 200 90 L 200 118 L 178 118 Z" 
          fill="#FF0000" />

    <!-- 'T' in Red -->
    <path d="M 252 70 L 302 70 L 302 85 L 289 85 L 289 118 L 265 118 L 265 85 L 252 85 Z" 
          fill="#FF0000" />

    <!-- 'E' in Red -->
    <path d="M 310 70 L 354 70 L 354 85 L 333 85 L 333 87 L 349 87 L 349 101 L 333 101 L 333 103 L 354 103 L 354 118 L 310 118 Z" 
          fill="#FF0000" />

    <!-- 'C' in Red -->
    <path d="M 362 70 L 406 70 L 406 85 L 385 85 L 385 103 L 406 103 L 406 118 L 362 118 Z" 
          fill="#FF0000" />

    <!-- 'H' (Second H) in Red -->
    <path d="M 414 70 L 438 70 L 438 85 L 456 85 L 456 70 L 480 70 L 480 118 L 456 118 L 456 101 L 438 101 L 438 118 L 414 118 Z" 
          fill="#FF0000" />

    <!-- 'AUTO CENTER INC.' Subtitle Text -->
    <text x="480" y="132" 
          font-family="Arial, 'Helvetica Neue', sans-serif" 
          font-size="12.5" 
          font-weight="900" 
          letter-spacing="1.5" 
          fill="#1c1f24" 
          text-anchor="end">AUTO CENTER INC.</text>
  </g>
</svg>
